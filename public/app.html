<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" id="sk-vp" content="width=480, viewport-fit=cover">
<script>
  /* حجم العرض قابل للضبط · the design's sizes were set inside a 402px mock-up,
     so the page lays out at a wider virtual width and the browser scales the
     whole thing down. Bigger number = smaller app. Try ?w=520 on the phone
     itself and keep whatever reads best. */
  (function () {
    var w = parseInt(new URLSearchParams(location.search).get('w'), 10);
    if (w >= 360 && w <= 900) {
      document.getElementById('sk-vp').setAttribute('content', 'width=' + w + ', viewport-fit=cover');
    }
  })();
</script>
<meta name="theme-color" content="#1F4A36">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sakeenah">
<meta name="mobile-web-app-capable" content="yes">
<title>Sakeenah · سكينة</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/phone.css">
</head>
<body>

  <!-- iPhone bezel: plain HTML/CSS, same 402x874 as the design -->

    <div class="sk-bezel">
      <div class="sk-screen">
        <div class="sk-statusbar">
          <span id="sk-clock">16:04</span>

          <span class="sk-sbicons">

            <svg width="16" height="11" viewBox="0 0 16 11" aria-hidden="true"><path d="M8 9.5 1 3a10 10 0 0 1 14 0z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
            <svg width="25" height="12" viewBox="0 0 25 12" aria-hidden="true"><rect x="0.6" y="0.6" width="20" height="10.8" rx="3" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.5"/><rect x="2.2" y="2.2" width="16.8" height="7.6" rx="1.8" fill="currentColor"/><path d="M22.4 4.2v3.6a2.4 2.4 0 0 0 0-3.6z" fill="currentColor" opacity="0.5"/></svg>
          </span>
        </div>
        <div id="sk-app"></div>

    </div>
  </div>

</div>

<audio id="sk-player" playsinline></audio>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
